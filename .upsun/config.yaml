# AI can make mistakes. Please modify this file to suit your needs.
applications:
  pacenote:
    type: nodejs:26
    build:
      flavor: none
    hooks:
      # The build needs devDependencies: typescript, @types/node and drizzle-kit
      # all live there, so `npm install --omit=dev` leaves `tsc` missing. Install
      # everything, compile, then prune back to the runtime dependencies.
      build: |
        set -ex
        npm install
        npm run build
        # tsc emits .js and nothing else, so the SQL migrations and the drizzle
        # journal next to them have to be carried into dist by hand.
        cp -R src/db/migrations dist/src/db/migrations
        # .upsun/ is config: the platform consumes it and it is gone by the time the
        # hook runs. dist is what ships, so the translator rides along in there.
        cp scripts/database-url.mjs dist/database-url.mjs
        npm prune --omit=dev
      # The app only knows DATABASE_URL; Upsun publishes the relationship in a
      # different shape, so translate it here. Idempotent: drizzle records
      # what it has already applied.
      deploy: |
        set -ex
        export DATABASE_URL="$(node dist/database-url.mjs)"
        node dist/src/db/migrate.js
    web:
      # `npm run dev` is tsx in watch mode, and tsx is a devDependency that the
      # prune above removes. Run the compiled entrypoint instead.
      commands:
        start: DATABASE_URL="$(node dist/database-url.mjs)" node dist/src/main.js
      locations:
        /:
          passthru: true
    relationships:
      database: {}

services:
  database:
    type: postgresql:18

routes:
  https://{default}/:
    type: upstream
    upstream: pacenote:http
